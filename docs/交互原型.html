<title data-page-node-id="9ABciVsPAMpIhP0a9mHPAb" data-pnid-children="LAHBMzX3odfSU3CojRNIVa">个人信息管家 · 可点交互原型</title>

/* ============================================================
   个人信息管家 · 可点交互原型
   Token 与画布「配色规范 / Color Tokens」及「交互态规范」完全一致
   ============================================================ */
:root{
  /* 品牌 */
  --brand:#5B54D9; --brand-hover:#6B64E3; --brand-press:#4A43C4;
  --brand-soft:#EDEBFC; --brand-text:#4A43C4; --brand-line:#D8D4F7;
  /* 文字 */
  --ink:#18181B; --ink-2:#3F3F49; --ink-3:#4B4B55;
  --muted:#64646E; --muted-2:#8A8A96; --faint:#9A9AA6; --faint-2:#A6A6B2;
  /* 面与线 */
  --card:#FFFFFF; --page:#F7F7F9; --rail:#F9F9FB;
  --fill:#F4F4F7; --fill-2:#F7F7F9; --track:#EFEFF3; --press:#E4E4EA;
  --line:#E7E7EC; --line-2:#EAEAEF; --line-hover:#DCDCE4;
  /* 语义 */
  --amber:#D97706; --amber-text:#B45309; --amber-bg:#FDF6EC; --amber-line:#F3E2C7;
  --red:#C4342F; --red-bg:#FDF6F6;
  --green:#15803D; --green-bg:#F0FDF4; --green-line:#BBF7D0;
  /* 圆角 */
  --r-6:6px; --r-8:8px; --r-9:9px; --r-10:10px; --r-12:12px; --r-13:13px; --r-14:14px; --r-22:22px;
  /* 投影 */
  --sh-1:0 1px 3px rgba(24,24,27,.05);
  --sh-2:0 8px 22px -6px rgba(24,24,27,.13), 0 2px 6px -2px rgba(24,24,27,.06);
  --sh-brand:0 4px 10px -3px rgba(91,84,217,.28);
  --sh-brand-h:0 5px 12px -3px rgba(91,84,217,.34);
  --sh-brand-p:0 2px 6px -2px rgba(74,67,196,.22);
  --sh-win:0 24px 56px -12px rgba(24,24,27,.10), 0 6px 16px -4px rgba(24,24,27,.08);
  --sh-float:0 28px 68px -16px rgba(24,24,27,.16), 0 8px 20px -6px rgba(24,24,27,.10);
  --glow:0 0 0 4px rgba(91,84,217,.22);
  --glow-soft:0 0 0 4px rgba(91,84,217,.20);
  /* 动效 —— 与「G 状态与过渡规范」一致 */
  --dur-hover:120ms; --dur-press:80ms; --ease:cubic-bezier(.2,.7,.4,1);
  --font:"Noto Sans SC","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"Geist Mono","JetBrains Mono",SFMono-Regular,Consolas,"Liberation Mono",monospace;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font);
  color:var(--ink);
  background:#EFEFF2;
  display:flex;flex-direction:column;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font-family:inherit;color:inherit;border:0;background:none;outline:none}
::selection{background:var(--brand-soft);color:var(--brand-text)}

/* ---------- 原型外壳（不属于产品 UI，仅用于演示） ---------- */
.topbar{
  flex:0 0 56px;display:flex;align-items:center;gap:16px;
  padding:0 20px;background:#FFFFFF;border-bottom:1px solid var(--line);
  position:relative;z-index:40;
}
.tb-brand{display:flex;align-items:center;gap:9px}
.tb-logo{
  width:24px;height:24px;border-radius:8px;flex:none;
  background:linear-gradient(135deg,#5B54D9 0%,#9378F5 100%);
  display:grid;place-items:center;color:#fff;
}
.tb-title{font-size:13px;font-weight:600;letter-spacing:.1px}
.tb-title span{color:var(--faint);font-weight:400;margin-left:6px}
.tb-mid{flex:1;display:flex;justify-content:center}
.tb-right{display:flex;align-items:center;gap:10px}

.seg{display:inline-flex;gap:2px;padding:3px;background:var(--track);border-radius:var(--r-10)}
.seg-i{
  height:28px;padding:0 14px;border-radius:8px;font-size:12.5px;font-weight:500;
  color:var(--faint);transition:background var(--dur-hover) var(--ease),color var(--dur-hover) var(--ease);
}
.seg-i:hover{color:var(--ink-3)}
.seg-i.is-on{
  background:#fff;color:var(--ink);font-weight:600;
  box-shadow:0 1px 3px rgba(24,24,27,.12);
}
.tb-ghost{
  height:32px;padding:0 13px;border-radius:var(--r-9);font-size:12.5px;font-weight:500;
  color:var(--ink-3);border:1px solid var(--line);
  display:inline-flex;align-items:center;gap:6px;
  transition:background var(--dur-hover) var(--ease),border-color var(--dur-hover) var(--ease),color var(--dur-hover) var(--ease);
}
.tb-ghost:hover{background:var(--fill-2);border-color:var(--line-hover);color:var(--ink)}
.tb-ghost:active{background:var(--track)}
.tb-check{
  display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);
  cursor:pointer;user-select:none;padding:0 4px;
}
.tb-check input{appearance:none;width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line-hover);position:relative;transition:all var(--dur-hover) var(--ease)}
.tb-check input:checked{background:var(--brand);border-color:var(--brand)}
.tb-check input:checked::after{content:"";position:absolute;left:4.6px;top:1.6px;width:4px;height:8px;border:2px solid #fff;border-top:0;border-left:0;transform:rotate(45deg)}

/* ---------- 舞台 ---------- */
#stage{position:relative;flex:1;overflow:hidden;
  background:
    radial-gradient(900px 520px at 14% -8%, rgba(91,84,217,.07), transparent 62%),
    radial-gradient(760px 460px at 92% 108%, rgba(91,84,217,.05), transparent 60%),
    #EFEFF2;
}
#slotMain{position:absolute;inset:0;display:grid;place-items:center}
#slotMain.hide{display:none}
.cap{
  position:absolute;left:50%;bottom:16px;transform:translateX(-50%);
  font-size:12px;color:var(--muted-2);background:rgba(255,255,255,.82);
  border:1px solid var(--line);border-radius:99px;padding:7px 15px;white-space:nowrap;
  backdrop-filter:blur(8px);pointer-events:none;max-width:calc(100% - 40px);overflow:hidden;text-overflow:ellipsis;
}
.cap b{color:var(--brand);font-weight:600}

/* ---------- 窗口 ---------- */
.win{
  width:1200px;height:760px;flex:none;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-14);
  box-shadow:var(--sh-win);overflow:hidden;
  display:flex;flex-direction:column;
  transform-origin:center center;
  transition:width 220ms var(--ease),height 220ms var(--ease);
}
.win.is-compact{width:900px;height:620px}
.win.is-closed{opacity:.22;filter:grayscale(1)}

/* 标题栏 */
.tbar{
  flex:0 0 48px;display:flex;align-items:center;justify-content:space-between;
  padding:0 14px 0 16px;
}
.is-compact .tbar{flex-basis:44px;padding:0 12px 0 14px}
.brand{display:flex;align-items:center;gap:9px}
.is-compact .brand{gap:8px}
.logo{
  width:26px;height:26px;border-radius:8px;flex:none;
  background:linear-gradient(135deg,#5B54D9 0%,#9378F5 100%);
  display:grid;place-items:center;color:#fff;
}
.logo.sm{width:24px;height:24px;border-radius:8px}
.is-compact .logo{width:22px;height:22px;border-radius:7px}
.app-name{font-size:13.5px;font-weight:600;letter-spacing:.1px}
.is-compact .app-name{font-size:12.5px}
.wctl{display:flex;align-items:center;gap:14px}
.is-compact .wctl{gap:12px}
.wbtn{
  width:22px;height:22px;display:grid;place-items:center;border-radius:6px;
  color:var(--muted);transition:background var(--dur-hover) var(--ease),color var(--dur-hover) var(--ease);
}
.wbtn:hover{background:var(--fill);color:var(--ink)}
.wbtn:active{background:var(--press)}
.wbtn.danger:hover{background:var(--red-bg);color:var(--red)}

/* 命令栏 */
.cbar{
  flex:0 0 64px;display:flex;align-items:center;gap:10px;
  padding:0 16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
}
.is-compact .cbar{flex-basis:56px;padding:0 14px;gap:8px}

.scope{
  width:92px;height:36px;flex:none;border-radius:var(--r-9);
  display:flex;align-items:center;justify-content:center;gap:4px;
  background:var(--fill);border:1px solid #EBEBF0;font-size:12px;font-weight:500;color:var(--muted);
  transition:background var(--dur-hover) var(--ease),border-color var(--dur-hover) var(--ease),color var(--dur-hover) var(--ease);
}
.scope:hover{background:var(--track);border-color:var(--line-hover);color:var(--ink-2)}
.is-compact .scope{display:none}
.scope.is-open{background:var(--brand-soft);border-color:var(--brand-line);color:var(--brand-text)}

.search{
  flex:1;height:36px;border-radius:var(--r-9);display:flex;align-items:center;gap:8px;
  padding:0 12px;background:var(--fill);border:1px solid #EBEBF0;
  transition:background var(--dur-hover) var(--ease),border-color var(--dur-hover) var(--ease),box-shadow var(--dur-hover) var(--ease);
}
.is-compact .search{height:34px}
.search:hover{border-color:var(--line-hover)}
.search.is-focus{background:#fff;border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand),var(--glow-soft)}
.s-ic{color:var(--faint);display:flex;flex:none;transition:color var(--dur-hover) var(--ease)}
.search.is-focus .s-ic{color:var(--brand)}
.search input{flex:1;font-size:13px;color:var(--ink)}
.is-compact .search input{font-size:12.5px}
.search input::placeholder{color:var(--faint)}
.s-clear{width:20px;height:20px;border-radius:50%;display:none;place-items:center;color:var(--faint);background:var(--line)}
.s-clear:hover{background:var(--line-hover);color:var(--ink-3)}
.search.has-q .s-clear{display:grid}

/* 按钮 */
.btn{
  height:36px;padding:0 14px;border-radius:var(--r-9);flex:none;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font-size:13px;font-weight:500;white-space:nowrap;
  transition:background var(--dur-hover) var(--ease),box-shadow var(--dur-hover) var(--ease),
             border-color var(--dur-hover) var(--ease),color var(--dur-hover) var(--ease),opacity var(--dur-hover) var(--ease);
}
.btn:active{transition-duration:var(--dur-press)}
.btn.primary{background:var(--brand);color:#fff;box-shadow:var(--sh-brand)}
.btn.primary:hover{background:var(--brand-hover);box-shadow:var(--sh-brand-h)}
.btn.primary:active{background:var(--brand-press);box-shadow:var(--sh-brand-p)}
.btn.primary:disabled{opacity:.38;box-shadow:none;cursor:not-allowed;pointer-events:none}
.btn.primary.is-loading{background:var(--brand-hover);box-shadow:var(--sh-brand);pointer-events:none}
.btn.ghost{background:#fff;color:var(--ink-2);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--fill-2);border-color:var(--line-hover)}
.btn.ghost:active{background:var(--track);color:var(--ink)}
.btn.ghost:disabled{opacity:.42;cursor:not-allowed;pointer-events:none}
.btn.soft{background:#F5F4FE;color:var(--brand-text);border:1px solid var(--brand-line);font-weight:600}
.btn.soft:hover{background:#EDEBFC}
.btn.soft:active{background:#E3E0FA}
.btn.full{width:100%}
.btn.sq{width:44px;padding:0;border-radius:var(--r-12)}
.btn.sm{height:32px;padding:0 12px;font-size:12.5px;border-radius:var(--r-8)}
.is-compact .btn.primary{padding:0;width:34px;height:34px}
.is-compact .btn.primary .b-tx{display:none}

.btn-ic{
  width:36px;height:36px;flex:none;border-radius:var(--r-9);
  display:inline-flex;align-items:center;justify-content:center;
  background:#fff;color:var(--muted);border:1px solid var(--line);
  transition:background var(--dur-hover) var(--ease),border-color var(--dur-hover) var(--ease),color var(--dur-hover) var(--ease),opacity var(--dur-hover) var(--ease);
}
.btn-ic:hover{background:var(--fill-2);border-color:var(--line-hover);color:var(--ink)}
.btn-ic:active{background:var(--track)}
.btn-ic.tinted{background:var(--brand-soft);border-color:transparent;color:var(--brand-text)}
.btn-ic.tinted:hover{background:#E3E0FA}
.btn-ic.is-loading{pointer-events:none;color:var(--faint)}
.is-compact .btn-ic{width:34px;height:34px}

/* 图标按钮（无边框，用于列表项/浮窗头部） */
.ib{
  width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--muted);
  transition:background var(--dur-hover) var(--ease),color var(--dur-hover) var(--ease);
}
.ib:hover{background:var(--fill);color:var(--ink)}
.ib:active{background:var(--press)}

/* 聚焦环 —— 2px 品牌描边 + 外发光，零位移 */
.fx{position:relative}
.fx:focus{outline:none}
.fx:focus-visible::after,body.ff .fx:focus::after{
  content:"";position:absolute;inset:-2px;border-radius:inherit;
  border:2px solid var(--brand);box-shadow:var(--glow);pointer-events:none;
}

/* 主体 */
.wbody{flex:1;min-height:0;display:flex}

/* 侧栏 */
.sbar{
  flex:0 0 232px;display:flex;flex-direction:column;gap:2px;
  padding:10px;background:var(--rail);border-right:1px solid var(--line);
  transition:flex-basis 220ms var(--ease),padding 220ms var(--ease);
}
.sg{font-size:11px;font-weight:600;color:var(--faint);padding:10px 10px 6px;letter-spacing:.3px}
.sg+.sg{margin-top:10px}
.nav{
  height:34px;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:var(--r-8);
  background:transparent;
  transition:background var(--dur-hover) var(--ease);
}
.nav:hover{background:var(--track)}
.nav:active{background:var(--press)}
.nav.is-on{background:var(--brand-soft)}
.nv-ic{display:flex;flex:none;color:var(--muted-2);transition:color var(--dur-hover) var(--ease)}
.nav:hover .nv-ic{color:var(--muted)}
.nav.is-on .nv-ic{color:var(--brand)}
.nv-tx{flex:1;font-size:13px;font-weight:500;color:var(--ink-3);text-align:left;transition:color var(--dur-hover) var(--ease)}
.nav:hover .nv-tx{color:var(--ink-2)}
.nav.is-on .nv-tx{color:var(--brand-text);font-weight:600}
.nv-ct{font-size:11px;color:var(--faint-2);font-variant-numeric:tabular-nums;transition:color var(--dur-hover) var(--ease)}
.nav.is-on .nv-ct{color:var(--brand);font-weight:500}
.nav .hook{width:6px;height:6px;border-radius:3px;background:var(--brand);flex:none}
.sbar-sp{flex:1}
.sbar-div{height:1px;background:var(--line-2);margin:10px 2px}
.nav.sub{height:36px;color:var(--ink-3)}
.nav.sub .nv-tx{color:var(--ink-3)}

/* 紧凑态侧栏 → 图标轨道 */
.is-compact .sbar{flex-basis:60px;padding:14px 8px;gap:12px;align-items:center}
.is-compact .sg{display:none}
.is-compact .nav{width:36px;height:36px;justify-content:center;padding:0;border-radius:var(--r-10);gap:0}
.is-compact .nv-tx,.is-compact .nv-ct{display:none}
.is-compact .nav{position:relative}
.is-compact .hook{position:absolute;top:6px;right:6px;width:5px;height:5px}
.is-compact .sbar-div{width:28px;margin:6px auto}
.is-compact .nav.sub{display:none}

/* 主区 */
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--page)}
.phead{
  flex:0 0 76px;display:flex;align-items:center;justify-content:space-between;
  padding:0 28px;background:#fff;border-bottom:1px solid var(--line);
}
.is-compact .phead{flex-basis:64px;padding:0 22px}
.ph-l{display:flex;flex-direction:column;gap:3px;min-width:0}
.ph-t{font-size:19px;font-weight:700;letter-spacing:-.2px}
.is-compact .ph-t{font-size:17px}
.ph-s{font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.is-compact .ph-s{font-size:11.5px}

.vtog{display:inline-flex;gap:2px;padding:3px;background:var(--track);border-radius:var(--r-9);flex:none;transition:opacity var(--dur-hover) var(--ease)}
.is-compact .vtog{height:30px}
.vt-i{
  height:26px;padding:0 13px;border-radius:7px;font-size:12px;font-weight:500;color:var(--muted-2);
  transition:background var(--dur-hover) var(--ease),color var(--dur-hover) var(--ease),box-shadow var(--dur-hover) var(--ease);
}
.vt-i:hover{background:var(--press);color:var(--ink-2)}
.vt-i.is-on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(24,24,27,.12)}
.vtog.is-off{opacity:.45;pointer-events:none}

.content{flex:1;min-height:0;overflow:auto;padding:28px;display:flex;flex-direction:column;gap:14px;scrollbar-width:thin;scrollbar-color:var(--line-hover) transparent}
.is-compact .content{padding:22px}
.content::-webkit-scrollbar{width:10px;height:10px}
.content::-webkit-scrollbar-thumb{background:#DEDEE5;border:3px solid transparent;background-clip:content-box;border-radius:9px}
.content::-webkit-scrollbar-thumb:hover{background:#CBCBD4;border:2px solid transparent;background-clip:content-box}
.content.is-flush{padding:0;gap:0}

/* 卡片 */
.card{
  background:#fff;border:1px solid var(--line);border-radius:var(--r-12);
  box-shadow:var(--sh-1);padding:16px;
  transition:border-color var(--dur-hover) var(--ease),box-shadow var(--dur-hover) var(--ease),background var(--dur-hover) var(--ease);
}
.card.clickable{cursor:pointer}
.card.clickable:hover{border-color:var(--line-hover);box-shadow:var(--sh-2)}
.card.clickable:active{background:#FAFAFC;box-shadow:0 2px 6px -2px rgba(24,24,27,.06)}
.cd-t{font-size:13.5px;font-weight:600;margin-bottom:6px}
.cd-d{font-size:12px;color:var(--muted-2);line-height:1.6}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
.sec-t{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.sec-m{font-size:11.5px;color:var(--faint)}

/* 统计行 */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.is-compact .stats{grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r-12);padding:14px 16px;box-shadow:var(--sh-1)}
.st-l{font-size:11.5px;color:var(--faint);margin-bottom:7px}
.st-v{font-size:22px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.st-v i{font-size:11.5px;font-weight:500;color:var(--muted-2);font-style:normal;margin-left:5px;letter-spacing:0}
.st-v.brand{color:var(--brand)}
.st-v.txt{font-size:15px;font-weight:600;letter-spacing:0}

/* 列表 */
.list{display:flex;flex-direction:column;gap:8px}
.li{
  display:flex;align-items:center;gap:12px;padding:12px 14px;
  background:#fff;border:1px solid var(--line);border-radius:var(--r-12);
  box-shadow:var(--sh-1);cursor:pointer;
  transition:border-color var(--dur-hover) var(--ease),box-shadow var(--dur-hover) var(--ease),background var(--dur-hover) var(--ease);
}
.li:hover{border-color:var(--line-hover);box-shadow:var(--sh-2)}
.li:active{background:#FAFAFC;box-shadow:0 2px 6px -2px rgba(24,24,27,.06)}
.li-ic{
  width:32px;height:32px;flex:none;border-radius:var(--r-9);
  display:grid;place-items:center;background:var(--fill);color:var(--muted);
}
.li-ic.brand{background:var(--brand-soft);color:var(--brand)}
.li-ic.code{background:#EEF2FF;color:#4F5BD5}
.li-ic.amber{background:var(--amber-bg);color:var(--amber-text)}
.li-bd{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.li-tt{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li-ds{font-size:11.5px;color:var(--muted-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li-mt{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--faint)}
.li-mt .sep{width:3px;height:3px;border-radius:50%;background:#D4D4DC;flex:none}

}

.sk{

@keyframes shim{from{background-position:130% 0}to{background-position:-130% 0}}

/* 空状态 */
.empty{

  text-align:center;padding:20px;
}
.empty-ic{

}

.empty-d{font-size:13px;color:var(--muted);line-height:1.7;max-width:400px}

/* 输入（浮窗内 / 聊天） */
.input{

  padding:0 14px;font-size:13px;

}
.input::placeholder{color:var(--faint)}
.input:hover{border-color:var(--line-hover)}
.input:focus{background:#fff;border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand),var(--glow-soft)}

/* 分段 / 标签 */
.tabs{display:flex;gap:3px;padding:3px;background:var(--fill);border-radius:var(--r-10)}
.tab{

  transition:background var(--dur-hover) var(--ease),color var(--dur-hover) var(--ease),box-shadow var(--dur-hover) var(--ease);
}
.tab:hover{background:var(--press);color:var(--ink-2)}

.tags{display:flex;flex-wrap:wrap;gap:7px}
.tag{

}
.tag:hover{background:var(--track);border-color:var(--line-hover);color:var(--ink-2)}

/* 开关 */
.row-item{
  display:flex;align-items:center;gap:14px;padding:14px 16px;background:#fff;
  border:1px solid var(--line);border-radius:var(--r-12);box-shadow:var(--sh-1);

}

.tgl{

.bars{display:flex;align-items:flex-end;gap:10px;height:92px;padding-top:6px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0}
.bar .b{width:100%;max-width:44px;border-radius:6px 6px 3px 3px;background:var(--brand-soft);transition:height 400ms var(--ease)}

.bar .bl{font-size:10.5px;color:var(--faint)}

.chat{flex:1;min-height:0;display:flex;flex-direction:column}

.msg{max-width:72%;font-size:13px;line-height:1.7;border-radius:14px;padding:11px 14px;animation:fadeUp 260ms var(--ease) both}

.msg.me{background:var(--brand);color:#fff;align-self:flex-end;border-top-right-radius:5px;box-shadow:var(--sh-brand)}

.chat-foot{

/* ============================================================

   ============================================================ */
function liHTML(it, i, opt = {}) {
  const primary = state.lang === 'tech' ? it.t : it.p;
  const second  = state.lang === 'tech' ? it.p : it.t;
  const delay   = opt.fade ? ` style="animation-delay:${Math.min(i, 7) * 55}ms"` : '';
  const cls     = `li${it.done ? ' done' : ''}${opt.fade ? ' fadeup' : ''}`;
  return `<div class="${cls}" data-idx="${i}" data-text="${(it.t + it.p + it.src).replace(/"/g, '&quot;')}"${delay}>
    <div class="li-ic ${it.kind || ''}">${SVG(I[it.ic] || I.file, 17, 1.8)}</div>
    <div class="li-bd">
      <div class="li-tt">${primary}</div>
      <div class="li-ds">${second}</div>
      <div class="li-mt"><span>${it.src}</span><span class="sep"></span><span>${it.time || ''}</span></div>
    </div>
    <div class="li-ac">
      <button class="ib fx" data-act="copy" title="复制">${SVG(I.copy, 16, 1.8)}</button>
      <button class="ib fx" data-act="more" title="更多">${SVG(I.more, 16, 1.8)}</button>
    </div>
  </div>`;
}

function listHTML(items, opt = {}) {
  if (!items.length) return emptyInline();
  return `<div class="list">${items.map((it, i) => liHTML(it, i, opt)).join('')}</div>`;
}

function emptyInline() {
  return `<div class="empty">
    <div class="empty-ic">${SVG(I.filter, 26, 1.8)}</div>
    <div class="empty-t">没有匹配的内容</div>
    <div class="empty-d">换个关键词试试，或者把「搜索」范围从「${SCOPE_LABEL[state.scope]}」切回「全部」。</div>
  </div>`;
}

function statHTML(l, v, u, brand) {
  const isText = typeof v === 'string' && !/^\d+$/.test(v);
  return `<div class="stat"><div class="st-l">${l}</div>
    <div class="st-v${brand ? ' brand' : ''}${isText ? ' txt' : ''}">${v}${u ? `<i>${u}</i>` : ''}</div></div>`;
}

function filtered(items) {
  if (!state.q) return items;
  const q = state.q.toLowerCase();
  return items.filter(it => (it.t + it.p + it.src).toLowerCase().includes(q));
}

function renderContent() {
  const c = $('#content');
  c.className = 'content' + (state.nav === 'chat' ? ' is-flush' : '');
  c.style.padding = state.nav === 'chat' ? '0' : '';
  if (state.skeleton) {
    c.innerHTML = `<div class="sec-h"><span class="sec-t">正在解析…</span><span class="sec-m">请稍候</span></div>
      <div class="list">${Array.from({ length: state.skeleton }).map(() => `
        <div class="sk">
          <div class="sk-ic shim"></div>
          <div class="sk-col"><div class="sk-b1 shim"></div><div class="sk-b2 shim"></div></div>
        </div>`).join('')}</div>`;
    return;
  }
  c.innerHTML = viewHTML();
  state.fadeIn = false;
  if (state.nav === 'chat') {
    const cb = $('#chatBody');
    if (cb) cb.scrollTop = cb.scrollHeight;

  if (state.nav === 'code' && !state.vsConnected) {

}

   ============================================================ */
function toast(msg, kind = 'ok') {
  const t = document.createElement('div');
  t.className = 'toast';
  const ic = kind === 'ok'
    ? '<path d="m6.6 12.4 3.4 3.4 7.4-8"/>'
    : '<circle cx="12" cy="12" r="8.4"/><path d="M12 8v4.6"/><circle cx="12" cy="15.8" r="1" fill="currentColor" stroke="none"/>';
  t.innerHTML = `<span class="ti">${SVG(ic, 16, 2.2)}</span>${msg}`;
  $('#toasts').appendChild(t);
  setTimeout(() => {
    t.classList.add('out');
    setTimeout(() => t.remove(), 220);
  }, 2200);
}

/* ============================================================
   7. 核心流程：快速记录 → spinner → 骨架屏 → 淡入
   ============================================================ */
const capBtn = $('#captureBtn');
capBtn.addEventListener('click', captureFlow);

async function captureFlow() {
  if (state.busy) return;
  state.busy = true;

  /* 先把落点切到「想法」，让整段流程发生在一个视图里，避免中途跳页 */
  if (state.nav !== 'idea') setNav('idea');
  await wait(120);

  /* ① 按钮转加载态：宽度锁定，标签与图标原地替换 —— 不允许出现抖动 */
  const w = capBtn.offsetWidth;
  capBtn.style.width = w + 'px';
  capBtn.classList.add('is-loading');
  capBtn.querySelector('.b-tx').textContent = '处理中';
  capBtn.querySelector('.b-ic').innerHTML = '<span class="spin"></span>';
  await wait(620);

  /* ② 骨架屏：灰块与真实列表项同尺寸，撑住结构 */
  state.skeleton = 3;
  renderContent();
  await wait(900);

  /* ③ 数据到达，原位淡入 */
  const item = CAPTURE_POOL[state.captureIdx++ % CAPTURE_POOL.length];
  state.extra.idea.unshift({ ...item, time: '刚刚' });
  state.skeleton = 0;
  state.fadeIn = true;
  renderAll();

  /* ④ 按钮复位，宽度在下一帧才释放 */
  capBtn.classList.remove('is-loading');
  capBtn.querySelector('.b-tx').textContent = '快速记录';
  capBtn.querySelector('.b-ic').innerHTML = SVG('<path d="M12 5.2v13.6M5.2 12h13.6"/>', 20, 2);
  requestAnimationFrame(() => { capBtn.style.width = ''; });

  toast('已记录 1 条 · 来自剪贴板');
  state.busy = false;
}

function cardAct(a, el) {
  switch (a) {
    case 'copy': {
      const li = el.closest('.li');
      const t = li.querySelector('.li-tt').textContent;
      navigator.clipboard?.writeText(t).catch(() => {});
      toast('已复制到剪贴板');
      break;
    }
    case 'toggle': {
      const i = +el.dataset.idx;
      const pool = [...state.extra.todo, ...DB.todo];
      const src = pool[i];
      if (!src) return;
      src.done = !src.done;
      el.classList.toggle('on', src.done);
      el.closest('.li').classList.toggle('done', src.done);
      toast(src.done ? '已完成' : '已取消完成');
      refreshTodoStats();
      break;
    }
    case 'more':      toast('更多操作菜单 · hover 才显现', 'info'); break;
    case 'trash-info':toast('删除内容保留 30 天，到期自动清除', 'info'); break;
    case 'tool':      toast(`已打开「${el.dataset.toolName}」`, 'info'); break;
  }
}

/* 勾选后同步「已完成 / 待处理」两个统计块 */
function refreshTodoStats() {
  const wrap = $('#content .stats');
  if (!wrap || wrap.children.length < 2) return;
  const all = [...state.extra.todo, ...DB.todo];
  wrap.children[0].querySelector('.st-v').innerHTML = all.length + '<i>条</i>';
  wrap.children[1].querySelector('.st-v').innerHTML = all.filter(t => t.done).length + '<i>条</i>';
}

/* ============================================================
   10. 智能问答
   ============================================================ */
async function doChat() {
  const inp = $('#chatInput');
  if (!inp || state.chatBusy) return;
  const text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  state.chat.push({ role: 'me', text });
  state.chat.push({ role: 'typing' });
  state.chatBusy = true;
  if (state.nav !== 'chat') setNav('chat'); else renderContent();

  await wait(950);
  state.chat = state.chat.filter(m => m.role !== 'typing');
  const answer = /react|性能/i.test(text)
    ? '你记录过 3 条相关的内容：<br>① <b>TodoList 的 memo 粒度太粗</b>——待办清单组件每次输入都整个重渲染；<br>② <b>React 性能优化清单</b>——5 天前从剪贴板存进资料库；<br>③ <b>TodoList.tsx 缺少 useCallback</b>——VS 代码分析在 2 小时前给出。'
    : /快捷键|shortcut/i.test(text)
      ? '你记了 2 条：<b>浮窗支持全局快捷键唤起</b>（昨天 21:40）和 <b>快捷键应该可自定义</b>（刚刚，来自剪贴板）。两条其实指向同一件事。'
      : '我在你的记录里找到了相关内容，但没有能直接回答这个问题的条目。可以换个说法，或者先把它记成一条想法。';
  state.chat.push({ role: 'ai', text: answer });
  state.chatBusy = false;
  renderContent();
  if (state.nav === 'chat') {
    const cb = $('#chatBody');
    if (cb) cb.scrollTop = cb.scrollHeight;
  }
}

  $$('#viewSeg .seg-i').forEach(b => b.classList.toggle('is-on', b.dataset.view === v));
  const f = $('#floatWin'), slot = $('#slotMain'), main = $('#winMain');

  if (v === 'main') {
    slot.classList.remove('hide');
    main.classList.remove('is-compact');
    if (state.floatOpen) { f.classList.remove('center'); f.classList.add('dock', 'open'); }
    else f.classList.remove('open');
    setCap('<b>主界面 · 1200 × 760</b>　点侧栏切页 · 点「快速记录」看完整反馈流程 · 点右上角「AI 问答」唤起悬浮窗');
  }
  if (v === 'compact') {
    slot.classList.remove('hide');
    main.classList.add('is-compact');
    f.classList.remove('open');
    state.floatOpen = false;
    setCap('<b>紧凑适配 · 900 × 620</b>　侧栏收成 60px 图标轨道，命令栏按钮转图标态，搜索范围下拉隐藏');
  }
  if (v === 'float') {
    slot.classList.add('hide');
    $('#restoreBtn').style.display = 'none';
    $('#restoreFloat').style.display = 'none';
    $('#restoreWrap').classList.remove('show');
    f.classList.remove('dock');
    f.classList.add('center', 'open');
    state.floatOpen = true;
    setCap('<b>悬浮窗 · 440 × 560</b>　切「想法 / 待办」· 输入后点「+」看按钮 spinner · 点 VS 状态标签可连接');
  }
  requestAnimationFrame(fitAll);
  setTimeout(fitAll, 260);   /* 窗口宽高有 220ms 过渡，过渡结束再量一次 */
}

function setCap(html) { $('#capText').innerHTML = html; }

function fitAll() {
  const stage = $('#stage');
  const main = $('#winMain');
  /* 主界面：按视口等比缩放，永远完整可见 */
  const sw = stage.clientWidth - 128;
  const sh = stage.clientHeight - 96;
  const s = Math.min(1, sw / main.offsetWidth, sh / main.offsetHeight);
  main.style.transform = s < 1 ? `scale(${s})` : '';

  /* 悬浮窗：整体套一层缩放，不影响它自身的开合动画 */
  const fh = 560, fw = 440;
  const fs = Math.min(1, (stage.clientHeight - 132) / fh, (stage.clientWidth - 96) / fw);
  $('#floatWrap').style.transform = fs < 1 ? `scale(${fs})` : '';
}

window.addEventListener('resize', fitAll);

$('#viewSeg').addEventListener('click', e => {
  const b = e.target.closest('[data-view]');
  if (b) switchView(b.dataset.view);
});

$('#ffToggle').addEventListener('change', e => {
  document.body.classList.toggle('ff', e.target.checked);
  toast(e.target.checked ? '聚焦环已常显（Tab 可遍历）' : '聚焦环仅在键盘导航时出现', 'info');
});

$('#playBtn').addEventListener('click', async () => {
  switchView('main');
  setNav('all');
  await wait(320);
  toast('开始播放：快速记录完整流程', 'info');
  await wait(420);
  await captureFlow();
  await wait(600);
  toast('流程结束 · 全程无位移，只有颜色与投影在变', 'info');
});

/* ============================================================
   13. 启动
   ============================================================ */
renderAll();
updateVsChip();
switchView('main');
requestAnimationFrame(() => requestAnimationFrame(fitAll));
setTimeout(fitAll, 260);
</script>
</body>
