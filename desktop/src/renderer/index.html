<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>个人信息管家</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Microsoft YaHei', sans-serif;
        background: #f5f6f8;
        color: #1f2937;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      .wrap {
        text-align: center;
        padding: 24px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 8px;
      }
      p {
        color: #6b7280;
        font-size: 13px;
        margin: 0 0 16px;
      }
      button {
        border: none;
        background: #6366f1;
        color: #fff;
        padding: 8px 20px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>个人信息管家</h1>
      <p id="msg">无法加载主界面，请检查网络后重试。</p>
      <button id="retry">重试</button>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
