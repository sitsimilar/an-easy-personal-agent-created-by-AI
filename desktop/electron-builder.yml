appId: com.personalagent.desktop
productName: 个人信息管家
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
# 运行时窗口/托盘图标（打包后经 process.resourcesPath 读取）
extraResources:
  - build/icon.png
win:
  target:
    - nsis
  icon: build/icon.ico
  # 关闭 exe 签名与图标编辑（winCodeSign 含 macOS 符号链接，无管理员权限的 Windows 上解压失败）
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 个人信息管家
  # 安装包自身的图标。win.icon 与这三项走的是不同通道：
  # win.icon / rcedit 改的是 exe 内嵌资源，被 signAndEditExecutable:false 关闭了；
  # 下面三项由 makensis 直接写入安装/卸载程序的资源段，不需要 winCodeSign，
  # 所以能生效。不配的话安装包会退回 NSIS 默认图标。
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  # 卸载时保留 userData（用户数据不被误删，由「一键删除」功能显式清理）
  deleteAppDataOnUninstall: false
